<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPSimplify — Key Points & Highlights</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom styling -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="keypoints-page">
    <!-- Floating Show Headers Button -->
    <button class="btn-show-headers" id="btn-show-headers" title="Show Header Controls">
        <i class="fa-solid fa-chevron-down"></i>
    </button>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-bolt-lightning logo-icon"></i>
                <h1>PP<span>Simplify</span></h1>
            </div>
            <p class="subtitle">Smart Speech segmentation tool powered by OpenRouter</p>
            <nav class="app-nav">
                <a href="/" class="nav-item"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
                <a href="/chunking" class="nav-item"><i class="fa-solid fa-scissors"></i> Smart Chunker</a>
                <a href="#" class="nav-item active"><i class="fa-solid fa-wand-magic-sparkles"></i> Key Points</a>
            </nav>
        </header>

        <!-- Configuration Bar -->
        <div class="card config-bar-card" style="margin-bottom: 30px;">
            <div class="config-grid">
                <div class="config-group">
                    <label class="option-title">Active File</label>
                    <div style="padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 12px; font-weight: 600; color: var(--accent-secondary); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" id="active-file-display">
                        Loading file...
                    </div>
                </div>
                <div class="config-group">
                    <label class="option-title">OpenRouter API Key (Optional Override)</label>
                    <div class="api-key-input-wrapper">
                        <input type="password" id="gemini-api-key-input" placeholder="Server .env key will be used if empty" class="path-input">
                        <button class="btn-toggle-visibility" id="toggle-key-visibility" title="Show/Hide Key">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <div class="config-group">
                    <label class="option-title">Model</label>
                    <div class="select-wrapper">
                        <select id="gemini-model-select" class="premium-select">
                            <option value="google/gemini-2.5-flash" selected>Gemini 2.5 Flash (Recommended)</option>
                            <option value="google/gemini-2.5-pro">Gemini 2.5 Pro</option>
                            <option value="google/gemini-2.0-flash">Gemini 2.0 Flash</option>
                        </select>
                    </div>
                </div>
                <div class="config-actions">
                    <button class="btn btn-primary btn-block" id="btn-run-all-keypoints">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate All
                    </button>
                </div>
            </div>
        </div>

        <!-- Session Navigation Bar -->
        <div class="session-nav-bar">
            <div class="session-nav-info">
                <button class="session-nav-btn" id="btn-prev-session" disabled title="Previous Session (Up Arrow)">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
                <div class="session-nav-indicator">
                    Session <span id="current-session-num">1</span> of <span id="total-sessions-num">1</span>
                </div>
                <button class="session-nav-btn" id="btn-next-session" disabled title="Next Session (Down Arrow)">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
            <div class="session-progress-container">
                <div class="session-progress-bar" id="session-progress-bar"></div>
            </div>
            <div class="kbd-hint">
                <kbd>↑</kbd> / <kbd>↓</kbd> Arrow Keys to Navigate
            </div>
        </div>

        <!-- Main Workspace Grid -->
        <div id="keypoints-workspace" class="workspace-grid">
            <!-- Left Side: Read-Only Chunks/Sessions -->
            <div class="card source-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-file-audio card-icon"></i>Finalized Chunks</h2>
                    <span class="badge badge-info" id="sessions-count-badge">0 Chunks</span>
                </div>
                <div class="sessions-list-container" id="read-only-sessions-wrapper">
                    <!-- Read-only sessions will render here -->
                </div>
            </div>

            <!-- Right Side: Heading & Subheading points -->
            <div class="card sessions-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-list-check card-icon"></i>Key Highlights</h2>
                    <div class="session-action-header-buttons">
                        <button class="btn btn-primary btn-sm" id="btn-save-keypoints">
                            <i class="fa-solid fa-save"></i> Save Changes
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-export-keypoints" title="Export JSON File">
                            <i class="fa-solid fa-file-export"></i> Export JSON
                        </button>
                        <button class="btn btn-secondary btn-sm" id="btn-export-docx" title="Export DOCX File">
                            <i class="fa-solid fa-file-word"></i> Export DOCX
                        </button>
                    </div>
                </div>

                <div class="sessions-list-container" id="keypoints-list-wrapper">
                    <!-- Dynamic keypoints editor for each session will render here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Script file -->
    <script src="/static/js/keypoints.js"></script>
</body>
</html>
